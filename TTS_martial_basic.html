<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- HTML5引入了一種讓網頁設計師通過標籤控制用戶的 viewport (可見區域)的方法。viewport 隨著設備的不同而變化，而且在手機上比在電腦屏幕上更小。 -->
    <title>基本功口令</title>
    <!-- 這邊設定CSS樣式 -->
    <style>
        /* 這邊是填寫要設定的CSS樣式 */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@200;400;900&display=swap');

        * {
            font-family: 'Noto Serif TC', serif, sans-serif;
            font-weight: 200;
            font-size: medium;
        }

        .markit {
            font-weight: 900;
            font-size: large;
        }

        .asblack {
            color: black;
        }

        .asblue {
            color: blue;
        }

        .asred {
            color: red;
        }

        .asunderline {
            text-decoration: underline;
        }

        body {
            background-image: linear-gradient(180deg, #FFFFFF, #81d8d0);
        }

        ul {
            margin-left: 1.2em;
            padding-left: 0;
        }

        input {
            font-weight: 900;
            font-size: large;
            text-align: center;
        }
    </style>
    <script>
        const synth = window.speechSynthesis;
        const say = (msg) => {
            let u = new SpeechSynthesisUtterance();
            //u.lang = 'zh-TW'; //這句絕對不要用
            u.text = msg;

            // 用 synth.getVoices() 取得支援的語音列表
            // 要注意網頁開啟後首次執行 window.speechSynthesis 後才會把語音功能載入
            // 大概要花幾秒鐘的時間才能完全載入,再來才能正確取得語音列表
            // 所以要想辦法延遲 synth.getVoices(); 的執行時間
            // 
            // 或是使用下面的事件偵測
            // (這個事件在載入過程會被觸發多次,很難用,他是偵測changed不是偵測完全載入完成,
            // 但這是window.speechSynthesis裡唯一的一個事件偵測,沒其他選擇)
            // var voices;
            // window.speechSynthesis.onvoiceschanged = function() {
            //   voices = synth.getVoices();
            //   // 注意 speak() 不要直接寫在這裡,不然會被重覆觸發多次
            // };
            let voices = synth.getVoices();

            for (let index = 0; index < voices.length; index++) {
                /*
                "Google US English"
                "Google 日本語"
                "Google 普通话（中国大陆）"
                "Google 粤語（香港）"
                "Google 國語（臺灣）"
                */

                //console.log(voices[index].name);
                if (voices[index].name == "Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)") { //HsiaoChen (Neural) - 曉臻 (MS Edge專用)
                    u.voice = voices[index];
                    break;
                } else if (voices[index].name == "Google 國語（臺灣）") { //Chrome專用
                    u.voice = voices[index];
                    break;
                } else {
                    //u.lang = 'zh-TW'; //這邊可能會有語音又被切回系統語音的問題
                }

                //當最後一個都還沒找到時才設u.lang
                if (index + 1 === voices.length) {
                    u.lang = 'zh-TW';
                }
            }

            synth.speak(u);
        };
        //
        // 製作一個發出嗶聲的函式
        function beep(sec){
            // 創建一個 AudioContext
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            // 創建一個 OscillatorNode 來生成 beep 聲
            const oscillator = audioCtx.createOscillator();
            oscillator.type = 'sine'; // 可以是 sine, square, sawtooth, triangle
            oscillator.frequency.value = 440; // 頻率，可以調整音高
            oscillator.connect(audioCtx.destination);
            for (let s = 0; s < sec; s++) {
                oscillator.start(1); // 意即一秒鐘後才發出聲音
                oscillator.stop(0.5);
            }
            audioCtx.close();
        }
        //
        //
        function start() {
            say("觀自在菩薩2");
            beep(10);
            say("你要讀出的中文內容1");
            say("你要讀出的中文內容2");
        }
    </script>
</head>

<body>
    <div id="input_1" style="display: block;">
        <p>
            <button type="button" onclick="start()">開始</button>
        </p>
        <hr />
    </div>
</body>

</html>
